name: Deploy PWA to Hugging Face Spaces

# Originally this also deployed the FastAPI backend and Streamlit dashboard here as Docker/Streamlit
# Spaces — removed once Hugging Face started requiring a paid PRO plan to create either (mid-2026;
# Streamlit-as-SDK is deprecated in favor of Docker too, so it hit the same wall). Those two now
# deploy to Render instead (render.yaml at the repo root) — only the PWA stays here, since Static
# Spaces remain free.
#
# The PWA is a Next.js static export (apps/mobile-pwa/out/), which isn't committed to this repo at
# all, so it's built fresh here and force-pushed as a single new commit each time — the same pattern
# any static-site deploy uses. The Space itself is its own separate git repo on huggingface.co.
#
# One-time setup this workflow depends on:
#   - A Hugging Face account, with a write access token saved as the HF_TOKEN repo secret.
#   - One Space created under that account (sdk: static — see apps/mobile-pwa/space-readme.md for its
#     required frontmatter), named in the HF_PWA_SPACE repo variable below as "username/space-name".
#   - HF_PWA_API_URL set as a repo variable, pointing at wherever the API actually ends up deployed
#     (the Render service's URL), so the PWA build talks to the real backend.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-pwa:
    runs-on: ubuntu-latest
    if: vars.HF_PWA_SPACE != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile-pwa/package-lock.json
      - name: Build the static export
        working-directory: apps/mobile-pwa
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.HF_PWA_API_URL }}
        run: |
          npm ci
          npm run build
          cp space-readme.md out/README.md
      - name: Push the build output to the PWA Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ vars.HF_PWA_SPACE }}
        run: |
          cd apps/mobile-pwa/out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${SPACE}" HEAD:main
