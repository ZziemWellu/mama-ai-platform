name: Deploy to Hugging Face Spaces

# Each Space is its own git repo on huggingface.co, so this pushes each piece of the monorepo to its
# own Space remote rather than the whole tree: the backend and dashboard directories go over as-is
# (git subtree split, so the Space's git history stays real and incremental); the PWA is a Next.js
# static export (apps/mobile-pwa/out/), which isn't committed to this repo at all, so it's built fresh
# here and force-pushed as a single new commit each time — the same pattern any static-site deploy uses.
#
# One-time setup this workflow depends on (see README "Deployment" section for the full walkthrough):
#   - A Hugging Face account, with a write access token saved as the HF_TOKEN repo secret.
#   - Three Spaces created under that account, named in the HF_API_SPACE / HF_DASHBOARD_SPACE /
#     HF_PWA_SPACE repo variables below as "username/space-name" (sdk: docker / streamlit / static
#     respectively — see services/api-gateway/README.md, apps/dashboard/README.md and
#     apps/mobile-pwa/space-readme.md for the exact frontmatter each one needs).
#   - DATABASE_URL / JWT_SECRET / ALLOWED_ORIGINS set as secrets on the API Space itself (not here —
#     Space secrets are separate from GitHub secrets).
#   - NEXT_PUBLIC_API_URL set as this repo's HF_PWA_API_URL variable, pointing at the live API Space
#     URL, so the PWA build talks to the real backend.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    if: vars.HF_API_SPACE != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push services/api-gateway to the API Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ vars.HF_API_SPACE }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git subtree split --prefix=services/api-gateway -b hf-api-deploy
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${SPACE}" hf-api-deploy:main

  deploy-dashboard:
    runs-on: ubuntu-latest
    if: vars.HF_DASHBOARD_SPACE != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push apps/dashboard to the Dashboard Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ vars.HF_DASHBOARD_SPACE }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git subtree split --prefix=apps/dashboard -b hf-dashboard-deploy
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${SPACE}" hf-dashboard-deploy:main

  deploy-pwa:
    runs-on: ubuntu-latest
    if: vars.HF_PWA_SPACE != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile-pwa/package-lock.json
      - name: Build the static export
        working-directory: apps/mobile-pwa
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.HF_PWA_API_URL }}
        run: |
          npm ci
          npm run build
          cp space-readme.md out/README.md
      - name: Push the build output to the PWA Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ vars.HF_PWA_SPACE }}
        run: |
          cd apps/mobile-pwa/out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${SPACE}" HEAD:main
