services:
  - type: web
    name: mama-ai-api
    runtime: python
    plan: free
    # Frankfurt, not Oregon: this app serves Ghana, and the API talks to the database on every single
    # request — co-locating both there (see the Neon project's own region) keeps that round trip
    # short, on top of Frankfurt being a much shorter hop from West Africa than the US west coast.
    region: frankfurt
    rootDir: services/api-gateway
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: |
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      # Paste your real Neon connection string here (Render dashboard -> this service -> Environment).
      # Not a Render-managed database: Render's own free Postgres plan auto-deletes after 30 days of
      # inactivity, which is what took this API down before - Neon's free tier doesn't do that.
      - key: DATABASE_URL
        sync: false
      # Render generates a real random value for this on first deploy - never a hardcoded default.
      - key: JWT_SECRET
        generateValue: true
      # The real frontend origin(s), comma-separated - e.g. the HF Static Space's URL once created.
      # Never leave this unset in production; core/config.py falls back to localhost-only origins,
      # which would silently break every request from the real deployed frontend.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: False

  - type: web
    name: mama-ai-dashboard
    runtime: python
    plan: free
    region: frankfurt
    rootDir: apps/dashboard
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: API_URL
        fromService:
          name: mama-ai-api
          type: web
          property: url
